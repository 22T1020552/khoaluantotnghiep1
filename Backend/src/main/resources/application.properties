# SMTP (required for sending OTP email)
# Gmail: MAIL_HOST=smtp.gmail.com, MAIL_PORT=587, MAIL_SMTP_AUTH=true, MAIL_SMTP_STARTTLS=true, MAIL_SMTP_SSL_TRUST=smtp.gmail.com
# Mailtrap: MAIL_HOST=sandbox.smtp.mailtrap.io, MAIL_PORT=2525, MAIL_SMTP_AUTH=true, MAIL_SMTP_STARTTLS=true
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SMTP_SSL_TRUST:}

# Danh sach email le tan nhan thong bao dat lich moi (cach nhau boi dau phay)
# clinic.notification.receptionist.emails=${RECEPTIONIST_NOTIFICATION_EMAILS:${RECEPTIONIST_NOTIFICATION_EMAIL:}}
clinic.notification.receptionist.emails=${RECEPTIONIST_NOTIFICATION_EMAILS:}

# Redis (luu OTP quen mat khau)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=5s

# Cau hinh nguong OTP quen mat khau
auth.forgot-password.otp.ttl-minutes=10
auth.forgot-password.otp.cooldown-seconds=60
auth.forgot-password.otp.send-limit-window-minutes=60
auth.forgot-password.otp.max-send-attempts=5
auth.forgot-password.otp.max-invalid-attempts=5

# JWT access token + refresh token
auth.jwt.access-token.secret=${JWT_ACCESS_TOKEN_SECRET:mysecretkey-mysecretkey-mysecretkey-123-access}
auth.jwt.refresh-token.secret=${JWT_REFRESH_TOKEN_SECRET:mysecretkey-mysecretkey-mysecretkey-123-refresh}
auth.jwt.access-token.ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
auth.jwt.refresh-token.ttl-days=${JWT_REFRESH_TOKEN_TTL_DAYS:7}

server.port=8081