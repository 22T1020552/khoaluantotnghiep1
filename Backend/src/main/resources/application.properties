spring.application.name=demo
# Support loading environment variables from .env when running locally.
spring.config.import=optional:file:.env[.properties],optional:file:./backend/.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chain_store_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# # Gemini API (free tier)
